<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Muzik Majlis</title>

<style>
body {
    margin: 0;
    background: transparent;
    font-family: Arial, sans-serif;
}

.player {
    max-width: 360px;
    margin: 20px auto;
    padding: 18px;
    background: #f5fbff;
    border: 1px solid #c6dfef;
    border-radius: 20px;
    box-shadow: 0 6px 20px rgba(40,90,130,0.15);
    color: #174d78;
    text-align: center;
}

.title {
    font-size: 16px;
    letter-spacing: 1px;
    margin-bottom: 15px;
}

button {
    width: 50px;
    height: 50px;
    border: none;
    border-radius: 50%;
    background: #5aa2d6;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

button:hover {
    background: #397fae;
}

.progress {
    width: 100%;
    height: 6px;
    background: #dceef9;
    border-radius: 10px;
    margin-top: 15px;
    overflow: hidden;
}

.bar {
    height: 100%;
    width: 0%;
    background: #5aa2d6;
}

.text {
    margin-top: 8px;
    font-size: 11px;
    color: #66839a;
}
</style>
</head>

<body>

<div class="player">

    <div class="title">🎵 Muzik Majlis</div>

    <button id="playButton">▶</button>

    <div class="progress">
        <div class="bar" id="progressBar"></div>
    </div>

    <div class="text">
        Tekan ▶ untuk memainkan muzik
    </div>

</div>

<audio id="music" src="paulyudin-romantic-wedding-piano-160698.mp3" preload="metadata"></audio>

<script>

const music = document.getElementById("music");
const playButton = document.getElementById("playButton");
const progressBar = document.getElementById("progressBar");

playButton.addEventListener("click", function() {

    if (music.paused) {

        music.play();

        playButton.textContent = "Ⅱ";

    } else {

        music.pause();

        playButton.textContent = "▶";

    }

});

music.addEventListener("timeupdate", function() {

    if (music.duration) {

        const progress =
            (music.currentTime / music.duration) * 100;

        progressBar.style.width = progress + "%";

    }

});

music.addEventListener("ended", function() {

    playButton.textContent = "▶";

    progressBar.style.width = "0%";

});

</script>

</body>
</html>
